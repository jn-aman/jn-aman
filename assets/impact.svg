<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" role="img" aria-label="Impact: 500+ engineers on Orion, upgrades from 3 weeks to 6 hours, ~800M records in ~20 minutes, 90% lower broker costs">
  <defs>
    <linearGradient id="num" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151026"/>
      <stop offset="1" stop-color="#0b0914"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .c { opacity: 0; animation: rise 0.8s ease-out forwards; }
    .c2 { animation-delay: 0.15s; } .c3 { animation-delay: 0.3s; } .c4 { animation-delay: 0.45s; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>

  <g class="c">
    <rect x="12" y="12" width="279" height="186" rx="18" fill="url(#card)" stroke="#2a2342"/>
    <rect x="36" y="12" width="231" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="36" y="48" class="mono" font-size="12" letter-spacing="2.5" fill="#a78bfa">VARONIS · ORION</text>
    <text x="34" y="112" class="sans" font-size="50" font-weight="800" letter-spacing="-1.5" fill="url(#num)">500+</text>
    <text x="36" y="146" class="sans" font-size="15" fill="#c4c4d4">engineers across 80 teams</text>
    <text x="36" y="168" class="sans" font-size="15" fill="#8b8ba3">on my developer control plane</text>
  </g>

  <g class="c c2">
    <rect x="307" y="12" width="279" height="186" rx="18" fill="url(#card)" stroke="#2a2342"/>
    <rect x="331" y="12" width="231" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="331" y="48" class="mono" font-size="12" letter-spacing="2.5" fill="#a78bfa">VARONIS · UPGRADES</text>
    <text x="329" y="112" class="sans" font-size="50" font-weight="800" letter-spacing="-1.5" fill="url(#num)">3w → 6h</text>
    <text x="331" y="146" class="sans" font-size="15" fill="#c4c4d4">upgrade time for 1,200+</text>
    <text x="331" y="168" class="sans" font-size="15" fill="#8b8ba3">customer-deployed collectors</text>
  </g>

  <g class="c c3">
    <rect x="602" y="12" width="279" height="186" rx="18" fill="url(#card)" stroke="#2a2342"/>
    <rect x="626" y="12" width="231" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="626" y="48" class="mono" font-size="12" letter-spacing="2.5" fill="#a78bfa">SENTINELONE · DATA</text>
    <text x="624" y="112" class="sans" font-size="50" font-weight="800" letter-spacing="-1.5" fill="url(#num)">~800M</text>
    <text x="626" y="146" class="sans" font-size="15" fill="#c4c4d4">records ingested in ~20 min</text>
    <text x="626" y="168" class="sans" font-size="15" fill="#8b8ba3">instead of ~10 hours</text>
  </g>

  <g class="c c4">
    <rect x="897" y="12" width="279" height="186" rx="18" fill="url(#card)" stroke="#2a2342"/>
    <rect x="921" y="12" width="231" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="921" y="48" class="mono" font-size="12" letter-spacing="2.5" fill="#a78bfa">SAFE SECURITY · COST</text>
    <text x="919" y="112" class="sans" font-size="50" font-weight="800" letter-spacing="-1.5" fill="url(#num)">−90%</text>
    <text x="921" y="146" class="sans" font-size="15" fill="#c4c4d4">message-broker costs after</text>
    <text x="921" y="168" class="sans" font-size="15" fill="#8b8ba3">a zero-downtime migration</text>
  </g>
</svg>
