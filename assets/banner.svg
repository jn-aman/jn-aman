<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Aman Jain - Staff Software Engineer at Varonis">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07070d"/>
      <stop offset="0.55" stop-color="#110b24"/>
      <stop offset="1" stop-color="#1e0f40"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.82" cy="0.18" r="0.55">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.08" cy="0.95" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="340" rx="22"/></clipPath>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .glowA { animation: pulse 7s ease-in-out infinite; }
    .glowB { animation: pulse 7s ease-in-out infinite 3.5s; }
    @keyframes pulse { 0%, 100% { opacity: 0.65; } 50% { opacity: 1; } }
    .tag { opacity: 0; animation: cycle 12s infinite; }
    .tag2 { animation-delay: 4s; }
    .tag3 { animation-delay: 8s; }
    @keyframes cycle {
      0% { opacity: 0; transform: translateY(8px); }
      5%, 28% { opacity: 1; transform: translateY(0); }
      33%, 100% { opacity: 0; transform: translateY(-8px); }
    }
    .caret { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .spin { transform-origin: 1000px 170px; animation: spin 40s linear infinite; }
    .spinR { transform-origin: 1000px 170px; animation: spin 26s linear infinite reverse; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <rect class="glowA" width="1200" height="340" fill="url(#glowA)"/>
    <rect class="glowB" width="1200" height="340" fill="url(#glowB)"/>

    <!-- Orbit monogram -->
    <circle class="spin" cx="1000" cy="170" r="118" fill="none" stroke="url(#ring)" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="4 10"/>
    <circle class="spinR" cx="1000" cy="170" r="92" fill="none" stroke="url(#ring)" stroke-opacity="0.8" stroke-width="2" stroke-dasharray="120 40 30 40"/>
    <circle cx="1000" cy="170" r="66" fill="#0d0a1c" stroke="#2e2554"/>
    <text x="1000" y="190" text-anchor="middle" class="sans" font-size="54" font-weight="800" letter-spacing="-2" fill="url(#name)">AJ</text>
    <g class="spin"><circle cx="1118" cy="170" r="5" fill="#22d3ee"/></g>
    <g class="spinR"><circle cx="1000" cy="78" r="4" fill="#a78bfa"/></g>

    <!-- Copy -->
    <text x="72" y="88" class="mono" font-size="15" letter-spacing="5" fill="#a78bfa">HI, I'M</text>
    <text x="66" y="166" class="sans" font-size="82" font-weight="800" letter-spacing="-2.5" fill="url(#name)">Aman Jain</text>
    <text x="72" y="208" class="mono" font-size="22" fill="#ede9fe">Staff Software Engineer <tspan fill="#8b5cf6">@</tspan> Varonis</text>

    <g class="mono" font-size="17" fill="#94a3b8">
      <text class="tag" x="72" y="250"><tspan fill="#22d3ee">&gt;</tspan> distributed systems &amp; platform engineering<tspan class="caret" fill="#a78bfa"> _</tspan></text>
      <text class="tag tag2" x="72" y="250"><tspan fill="#22d3ee">&gt;</tspan> multi-tenant SaaS on AWS and GCP<tspan class="caret" fill="#a78bfa"> _</tspan></text>
      <text class="tag tag3" x="72" y="250"><tspan fill="#22d3ee">&gt;</tspan> LLM agents &amp; agentic workflows<tspan class="caret" fill="#a78bfa"> _</tspan></text>
    </g>

    <!-- Chips -->
    <g class="sans" font-size="14" font-weight="600">
      <rect x="72" y="276" width="168" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#8b5cf6" stroke-opacity="0.5"/>
      <text x="156" y="298" text-anchor="middle" fill="#ddd6fe">8x AWS Certified</text>
      <rect x="252" y="276" width="236" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#8b5cf6" stroke-opacity="0.5"/>
      <text x="370" y="298" text-anchor="middle" fill="#ddd6fe">Claude Certified Architect</text>
      <rect x="500" y="276" width="158" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#22d3ee" stroke-opacity="0.45"/>
      <text x="579" y="298" text-anchor="middle" fill="#cffafe">New Delhi, India</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="339" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>
